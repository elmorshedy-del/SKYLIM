name: Import Meridian site

on:
  push:
    branches:
      - import-meridian-site
    paths:
      - '.import/**'
      - '.github/workflows/import-meridian-site.yml'

permissions:
  contents: write

jobs:
  import-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify archive and extract source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import shutil
          import tarfile

          pieces = []
          for i in range(11):
              text = Path(f'.import/part-{i:02d}').read_text()
              if i == 0:
                  assert len(text) == 12001, len(text)
                  text = text[:12000]
              elif i == 5:
                  assert len(text) == 11999, len(text)
                  text = text[:4959] + 'J' + text[4959:]
              pieces.append(text)

          for i in range(5):
              pieces.append(Path(f'.import/part-11-{i:02d}').read_text())

          encoded = ''.join(pieces)
          assert len(encoded) == 140220, len(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '5219d9e5ffc0af6481289c3dc377b898eba087978cb708e02e25a7bfd15107b1'

          archive = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(archive).hexdigest() == '43fe230dba0f01503a500bccef81108b7843d04bf48f942b1024fb722703518d'

          temp = Path('.import/extracted')
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir(parents=True)

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              root = temp.resolve()
              for member in tf.getmembers():
                  target = (temp / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f'Unsafe archive path: {member.name}')
              tf.extractall(temp)

          source = temp / 'site'
          expected = {
              'README.md', 'INTEGRATION-GUIDE.md', 'build.py', 'build_css.py',
              'build_js.py', 'data.py', 'index.html', 'pricing.md',
              'robots.txt', 'sitemap.xml',
          }
          if not source.is_dir():
              raise RuntimeError('Expected site/ directory was not found in archive')
          actual = {p.name for p in source.iterdir()}
          assert actual == expected, (actual, expected)

          for item in source.iterdir():
              dest = Path(item.name)
              if dest.exists():
                  if dest.is_dir():
                      shutil.rmtree(dest)
                  else:
                      dest.unlink()
              if item.is_dir():
                  shutil.copytree(item, dest)
              else:
                  shutil.copy2(item, dest)

          shutil.rmtree('.import')
          for workflow_name in ('import-meridian-site.yml', 'import-meridian.yml'):
              workflow = Path('.github/workflows') / workflow_name
              if workflow.exists():
                  workflow.unlink()
          workflows = Path('.github/workflows')
          github_dir = Path('.github')
          if workflows.exists() and not any(workflows.iterdir()):
              workflows.rmdir()
          if github_dir.exists() and not any(github_dir.iterdir()):
              github_dir.rmdir()
          PY

      - name: Commit imported site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import Meridian black car site'
          git push origin HEAD:import-meridian-site
