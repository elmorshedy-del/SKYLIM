name: Import Meridian site

on:
  push:
    branches:
      - import-meridian-site
    paths:
      - '.github/workflows/import-meridian.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and extract source package
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/meridian-black-car-site.tar.gz
          for f in .import/part-*; do
            echo "decoding $f"
            base64 -d "$f" >> /tmp/meridian-black-car-site.tar.gz
          done
          echo "43fe230dba0f01503a500bccef81108b7843d04bf48f942b1024fb722703518d  /tmp/meridian-black-car-site.tar.gz" | sha256sum -c -
          tar -xzf /tmp/meridian-black-car-site.tar.gz --strip-components=1
          rm -rf .import
      - name: Commit imported site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import Meridian Black Car site source"
          git push origin HEAD:import-meridian-site
