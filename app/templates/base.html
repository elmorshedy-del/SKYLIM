<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="{% block robots %}noindex,nofollow{% endblock %}">
<meta name="theme-color" content="#0A0E1C">
<title>{% block title %}{{ brand.name }}{% endblock %}</title>
<link rel="preload" href="/static/fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="wrap {% block wrapclass %}{% endblock %} in">
    <a class="logo" href="/" aria-label="{{ brand.name }} home">{{ brand_wordmark }}</a>
    {% block topright %}{% endblock %}
  </div>
</header>
<main>
  <div class="wrap {{ self.wrapclass() }}">
    {% block content %}{% endblock %}
  </div>
</main>
<footer class="foot">
  <div class="wrap {{ self.wrapclass() }}">
    <a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/accessibility">Accessibility</a>
    <span>{{ brand.phone_display }} · {{ brand.email }}</span>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
