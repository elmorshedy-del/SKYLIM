<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="{% block robots %}noindex,nofollow{% endblock %}">
<meta name="theme-color" content="#000000">
<title>{% block title %}{{ brand.name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="wrap {% block wrapclass %}{% endblock %} in">
    <a class="logo" href="/"><span class="logo-mk" aria-hidden="true">M</span><span>{{ brand.name }}</span></a>
    {% block topright %}{% endblock %}
  </div>
</header>
<main>
  <div class="wrap {{ self.wrapclass() }}">
    {% block content %}{% endblock %}
  </div>
</main>
<footer class="foot">
  <div class="wrap {{ self.wrapclass() }}">
    <a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/accessibility">Accessibility</a>
    <span>{{ brand.phone_display }} · {{ brand.email }}</span>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
