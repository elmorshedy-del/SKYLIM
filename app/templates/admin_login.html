{% extends "base.html" %}
{% block title %}Owner sign-in · {{ brand.name }}{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;margin:40px auto">
  <h1 style="margin-bottom:6px">Owner sign-in</h1>
  <p class="muted small">Approvals, trip status and payments.</p>
  {% if error %}<div class="notice bad" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn btn-primary btn-full" type="submit" style="margin-top:16px">Sign in</button>
  </form>
</section>
{% endblock %}
